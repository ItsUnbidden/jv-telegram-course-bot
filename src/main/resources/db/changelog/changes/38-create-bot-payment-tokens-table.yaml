databaseChangeLog:
  - changeSet:
      id: create-bot-payment-tokens-table
      author: Unbidden
      changes:
        - createTable:
            tableName: bot_payment_tokens
            columns: 
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
              - column:
                  name: bot_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_bots_bot_payment_tokens
                    references: bots(id)
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: false
              - column: 
                  name: last_rotated_at
                  type: datetime
              - column:
                  name: status
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: binary(32)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  constraints:
                    nullable: false
