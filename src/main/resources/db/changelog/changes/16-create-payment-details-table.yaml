databaseChangeLog:
  - changeSet:
      id: create-payment-details-table
      author: Unbidden
      changes:
        - createTable:
            tableName: payment_details
            columns: 
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: type
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_users_payment_details
                    references: users(id)
              - column:
                  name: bot_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_bots_payment_details
                    references: bots(id)
                    nullable: false
              - column:
                  name: course_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_courses_payment_details
                    references: courses(id)
              - column:
                  name: timestamp
                  type: datetime
                  constraints:
                    nullable: false 
              - column:
                  name: total_amount
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: varchar(3)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: telegram_payment_charge_id
                  type: TEXT
              - column:
                  name: refunded_at
                  type: datetime
